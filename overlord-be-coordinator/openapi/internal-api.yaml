openapi: 3.1.0
info:
  title: overlord-be-coordinator internal api
  version: 0.1.0
servers:
  - url: http://127.0.0.1:13300
paths:
  /api/internal/register:
    post:
      operationId: registerIndexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered indexer
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered:
                    $ref: '#/components/schemas/IndexerRegistration'
  /api/internal/results:
    post:
      operationId: ingestResults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultBatch'
      responses:
        '202':
          description: Accepted result batch
  /api/internal/search-events:
    post:
      operationId: ingestSearchEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEvent'
      responses:
        '202':
          description: Accepted search lifecycle event
  /api/internal/snoop-flush:
    post:
      operationId: flushSnoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indexer_id, entries]
              properties:
                indexer_id:
                  type: string
                  format: uuid
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/SnoopEntry'
      responses:
        '202':
          description: Accepted snoop snapshot
  /api/internal/snoop-restore/{indexer_id}:
    get:
      operationId: restoreSnoop
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored snoop entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnoopEntry'
  /api/internal/popular-hashes:
    get:
      operationId: popularHashes
      responses:
        '200':
          description: Popular hashes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularHash'
  /api/agents/{indexer_id}/interfaces:
    get:
      operationId: getAgentInterfaces
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current coordinator-side interface view for the agent
          content:
            application/json:
              schema:
                type: object
                required: [registration, report, config, nat, last_error]
                properties:
                  registration:
                    $ref: '#/components/schemas/IndexerRegistration'
                  report:
                    allOf:
                      - $ref: '#/components/schemas/AgentNetworkReport'
                    nullable: true
                  config:
                    $ref: '#/components/schemas/AgentNetworkingConfig'
                  nat:
                    allOf:
                      - $ref: '#/components/schemas/NatStatusSnapshot'
                    nullable: true
                  last_error:
                    type: string
                    nullable: true
  /api/agents/{indexer_id}/interface-selection:
    post:
      operationId: applyAgentInterfaceSelection
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentNetworkingConfig'
      responses:
        '200':
          description: Refreshed interface report after applying selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentNetworkReport'
components:
  schemas:
    Protocol:
      type: string
      enum: [kad2]
    HashType:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [ed2k]
        value:
          type: string
    ContentType:
      type: string
      enum: [video, audio, document, archive, software, unknown]
    TagEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}
    Source:
      type: object
      required: [protocol, address, extra]
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        address:
          type: string
        extra: {}
    FileRecord:
      type: object
      required: [hashes, names, size, content_type, tags, sources]
      properties:
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/HashType'
        names:
          type: array
          items:
            type: string
        size:
          type: integer
          format: int64
          nullable: true
        content_type:
          allOf:
            - $ref: '#/components/schemas/ContentType'
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagEntry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    SearchKind:
      type: string
      enum: [keyword, source, notes]
    SearchJob:
      type: object
      required: [job_id, kind, query, file_hash, file_size, callback_url]
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SearchKind'
        query:
          type: string
          nullable: true
        file_hash:
          allOf:
            - $ref: '#/components/schemas/HashType'
          nullable: true
        file_size:
          type: integer
          format: int64
          nullable: true
        callback_url:
          type: string
    ResultBatch:
      type: object
      required: [job_id, indexer_id, protocol, files]
      properties:
        job_id:
          type: string
          format: uuid
          nullable: true
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRecord'
    SearchEventStatus:
      type: string
      enum: [started, batch_received, completed, failed, cancelled]
    SearchEvent:
      type: object
      required: [job_id, indexer_id, status, result_count, batch_count, error]
      properties:
        job_id:
          type: string
          format: uuid
        indexer_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SearchEventStatus'
        result_count:
          type: integer
          nullable: true
        batch_count:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
    SearchCancelRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid
    InterfaceAddressFamily:
      type: string
      enum: [ipv4, ipv6]
    AgentInterfaceAddress:
      type: object
      required: [family, address]
      properties:
        family:
          $ref: '#/components/schemas/InterfaceAddressFamily'
        address:
          type: string
    AgentInterface:
      type: object
      required:
        [name, description, addresses, is_loopback, is_vpn_candidate, has_default_route]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AgentInterfaceAddress'
        is_loopback:
          type: boolean
        is_vpn_candidate:
          type: boolean
        has_default_route:
          type: boolean
    InterfaceSelectionState:
      type: string
      enum: [pending, confirmed, applied, error]
    InterfaceBindingSelection:
      type: object
      required: [bind_iface, bind_ip, selection_confirmed]
      properties:
        bind_iface:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
    InterfaceBindingReport:
      type: object
      required:
        [
          recommended_interface_name,
          bind_iface,
          resolved_bind_ip,
          selection_confirmed,
          ready,
          state,
          last_error
        ]
      properties:
        recommended_interface_name:
          type: string
          nullable: true
        bind_iface:
          type: string
          nullable: true
        resolved_bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
        ready:
          type: boolean
        state:
          $ref: '#/components/schemas/InterfaceSelectionState'
        last_error:
          type: string
          nullable: true
    AgentNetworkReport:
      type: object
      required: [interfaces, control, p2p]
      properties:
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/AgentInterface'
        control:
          $ref: '#/components/schemas/InterfaceBindingReport'
        p2p:
          $ref: '#/components/schemas/InterfaceBindingReport'
    AgentControlConfig:
      type: object
      required: [bind_iface, bind_ip, selection_confirmed, listen_port]
      properties:
        bind_iface:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
        listen_port:
          type: integer
    AgentKadConfig:
      type: object
      required: [listen_port]
      properties:
        listen_port:
          type: integer
    AgentEd2kConfig:
      type: object
      required: [listen_port]
      properties:
        listen_port:
          type: integer
    AgentP2pConfig:
      type: object
      required: [bind_iface, bind_ip, selection_confirmed, kad, ed2k]
      properties:
        bind_iface:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
        kad:
          $ref: '#/components/schemas/AgentKadConfig'
        ed2k:
          $ref: '#/components/schemas/AgentEd2kConfig'
    AgentNatP2pConfig:
      type: object
      required:
        [
          enabled,
          backend_order,
          igd_ip,
          minissdpd_socket,
          ssdp_local_port,
          discovery_timeout_secs,
          lease_duration_secs,
          renew_margin_secs,
          external_ip_override
        ]
      properties:
        enabled:
          type: boolean
        backend_order:
          type: array
          items:
            type: string
        igd_ip:
          type: string
          nullable: true
        minissdpd_socket:
          type: string
          nullable: true
        ssdp_local_port:
          type: integer
          nullable: true
        discovery_timeout_secs:
          type: integer
        lease_duration_secs:
          type: integer
        renew_margin_secs:
          type: integer
        external_ip_override:
          type: string
          nullable: true
    AgentNatConfig:
      type: object
      required: [p2p]
      properties:
        p2p:
          $ref: '#/components/schemas/AgentNatP2pConfig'
    AgentNetworkingConfig:
      type: object
      required: [control, p2p, nat]
      properties:
        control:
          $ref: '#/components/schemas/AgentControlConfig'
        p2p:
          $ref: '#/components/schemas/AgentP2pConfig'
        nat:
          $ref: '#/components/schemas/AgentNatConfig'
    SelectedGateway:
      type: object
      required: [backend, control_url, local_ip, gateway_ip, external_ip]
      properties:
        backend:
          type: string
        control_url:
          type: string
        local_ip:
          type: string
          nullable: true
        gateway_ip:
          type: string
          nullable: true
        external_ip:
          type: string
          nullable: true
    MappedEndpoint:
      type: object
      required:
        [name, protocol, local_addr, external_addr, lease_expires_in_secs, backend]
      properties:
        name:
          type: string
        protocol:
          type: string
          enum: [tcp, udp]
        local_addr:
          type: string
        external_addr:
          type: string
        lease_expires_in_secs:
          type: integer
        backend:
          type: string
    NatStatusSnapshot:
      type: object
      required:
        [
          enabled,
          gateway_discovered,
          backend,
          bind_ip,
          igd_ip,
          minissdpd_socket,
          ssdp_local_port,
          external_ip_override,
          gateway,
          mappings,
          observed_external_addresses,
          last_refresh_unix_secs,
          last_error
        ]
      properties:
        enabled:
          type: boolean
        gateway_discovered:
          type: boolean
        backend:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        igd_ip:
          type: string
          nullable: true
        minissdpd_socket:
          type: string
          nullable: true
        ssdp_local_port:
          type: integer
          nullable: true
        external_ip_override:
          type: string
          nullable: true
        gateway:
          allOf:
            - $ref: '#/components/schemas/SelectedGateway'
          nullable: true
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/MappedEndpoint'
        observed_external_addresses:
          type: array
          items:
            type: string
        last_refresh_unix_secs:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
    IndexerStats:
      type: object
      required:
        [
          indexer_id,
          protocol,
          peers_connected,
          crawl_rate,
          snoop_queue_depth,
          staging_queue_depth,
          uptime_secs,
          nat,
          interface_report
        ]
      properties:
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        peers_connected:
          type: integer
        crawl_rate:
          type: number
        snoop_queue_depth:
          type: integer
        staging_queue_depth:
          type: integer
        uptime_secs:
          type: integer
          format: int64
        nat:
          allOf:
            - $ref: '#/components/schemas/NatStatusSnapshot'
          nullable: true
        interface_report:
          allOf:
            - $ref: '#/components/schemas/AgentNetworkReport'
          nullable: true
        publish_observability:
          allOf:
            - $ref: '#/components/schemas/KadPublishObservability'
          nullable: true
        harvest_observability:
          allOf:
            - $ref: '#/components/schemas/KadHarvestObservability'
          nullable: true
    PublishSeedSource:
      type: string
      enum: [coordinator, synthetic_fallback, manual_api]
    PublishBatchSummary:
      type: object
      required:
        [
          seed_source,
          published_items,
          closest_contacts_considered,
          attempted_contacts,
          acked_contacts,
          failed_contacts,
          timed_out_contacts,
          completed_at,
          last_success_at
        ]
      properties:
        seed_source:
          $ref: '#/components/schemas/PublishSeedSource'
        published_items:
          type: integer
        closest_contacts_considered:
          type: integer
        attempted_contacts:
          type: integer
        acked_contacts:
          type: integer
        failed_contacts:
          type: integer
        timed_out_contacts:
          type: integer
        completed_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
          nullable: true
    PublishCounters:
      type: object
      required:
        [
          batches,
          published_items,
          closest_contacts_considered,
          attempted_contacts,
          acked_contacts,
          failed_contacts,
          timed_out_contacts,
          last_batch_at,
          last_success_at
        ]
      properties:
        batches:
          type: integer
          format: int64
        published_items:
          type: integer
          format: int64
        closest_contacts_considered:
          type: integer
          format: int64
        attempted_contacts:
          type: integer
          format: int64
        acked_contacts:
          type: integer
          format: int64
        failed_contacts:
          type: integer
          format: int64
        timed_out_contacts:
          type: integer
          format: int64
        last_batch_at:
          type: string
          format: date-time
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
    AgentLogFileStatus:
      type: object
      required: [path, rotation, max_files, last_write_at]
      properties:
        path:
          type: string
        rotation:
          type: string
        max_files:
          type: integer
        last_write_at:
          type: string
          format: date-time
          nullable: true
    KadPublishObservability:
      type: object
      required:
        [
          last_seed_source,
          last_seed_at,
          latest_keyword_batch,
          latest_source_batch,
          keyword_counters,
          source_counters,
          log_file
        ]
      properties:
        last_seed_source:
          allOf:
            - $ref: '#/components/schemas/PublishSeedSource'
          nullable: true
        last_seed_at:
          type: string
          format: date-time
          nullable: true
        latest_keyword_batch:
          allOf:
            - $ref: '#/components/schemas/PublishBatchSummary'
          nullable: true
        latest_source_batch:
          allOf:
            - $ref: '#/components/schemas/PublishBatchSummary'
          nullable: true
        keyword_counters:
          $ref: '#/components/schemas/PublishCounters'
        source_counters:
          $ref: '#/components/schemas/PublishCounters'
        log_file:
          allOf:
            - $ref: '#/components/schemas/AgentLogFileStatus'
          nullable: true
    KadHarvestFamilyObservability:
      type: object
      required:
        [
          observed_requests,
          unique_shapes_observed,
          queued_entries,
          last_seen_at,
          last_from,
          last_target,
          last_start_position,
          last_size,
          last_restrictive_bytes
        ]
      properties:
        observed_requests:
          type: integer
          format: int64
        unique_shapes_observed:
          type: integer
          format: int64
        queued_entries:
          type: integer
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        last_from:
          type: string
          nullable: true
        last_target:
          type: string
          nullable: true
        last_start_position:
          type: integer
          nullable: true
        last_size:
          type: integer
          format: int64
          nullable: true
        last_restrictive_bytes:
          type: integer
          nullable: true
    KadPassiveReplayObservability:
      type: object
      required:
        [
          started_cycles,
          completed_cycles,
          idle_cycles,
          emitted_results,
          posted_batches,
          post_failures,
          last_started_at,
          last_completed_at,
          last_idle_at,
          last_error_at,
          last_target,
          last_start_position,
          last_restrictive_bytes,
          last_result_count,
          last_batches_posted,
          last_error
        ]
      properties:
        started_cycles:
          type: integer
          format: int64
        completed_cycles:
          type: integer
          format: int64
        idle_cycles:
          type: integer
          format: int64
        emitted_results:
          type: integer
          format: int64
        posted_batches:
          type: integer
          format: int64
        post_failures:
          type: integer
          format: int64
        last_started_at:
          type: string
          format: date-time
          nullable: true
        last_completed_at:
          type: string
          format: date-time
          nullable: true
        last_idle_at:
          type: string
          format: date-time
          nullable: true
        last_error_at:
          type: string
          format: date-time
          nullable: true
        last_target:
          type: string
          nullable: true
        last_start_position:
          type: integer
          nullable: true
        last_restrictive_bytes:
          type: integer
          nullable: true
        last_result_count:
          type: integer
        last_batches_posted:
          type: integer
        last_error:
          type: string
          nullable: true
    KadHarvestObservability:
      type: object
      required: [keyword_requests, source_requests, notes_requests, passive_keyword_replay]
      properties:
        keyword_requests:
          $ref: '#/components/schemas/KadHarvestFamilyObservability'
        source_requests:
          $ref: '#/components/schemas/KadHarvestFamilyObservability'
        notes_requests:
          $ref: '#/components/schemas/KadHarvestFamilyObservability'
        passive_keyword_replay:
          $ref: '#/components/schemas/KadPassiveReplayObservability'
    ConfigUpdate:
      type: object
      required: [protocol, config]
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        config: {}
    SnoopEntry:
      oneOf:
        - $ref: '#/components/schemas/KeywordSnoopEntry'
        - $ref: '#/components/schemas/SourceSnoopEntry'
        - $ref: '#/components/schemas/NotesSnoopEntry'
    KeywordSnoopEntry:
      type: object
      required:
        [family, logical_key, target, start_position, hit_count, first_seen, last_seen, last_drained_at]
      properties:
        family:
          type: string
          enum: [keyword]
        logical_key:
          type: string
        target:
          type: string
        start_position:
          type: integer
        restrictive_payload_hex:
          type: string
          nullable: true
        hit_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_drained_at:
          type: string
          format: date-time
          nullable: true
    SourceSnoopEntry:
      type: object
      required:
        [family, logical_key, target, start_position, size, hit_count, first_seen, last_seen, last_drained_at]
      properties:
        family:
          type: string
          enum: [source]
        logical_key:
          type: string
        target:
          type: string
        start_position:
          type: integer
        size:
          type: integer
          format: int64
        hit_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_drained_at:
          type: string
          format: date-time
          nullable: true
    NotesSnoopEntry:
      type: object
      required: [family, logical_key, target, size, hit_count, first_seen, last_seen, last_drained_at]
      properties:
        family:
          type: string
          enum: [notes]
        logical_key:
          type: string
        target:
          type: string
        size:
          type: integer
          format: int64
        hit_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_drained_at:
          type: string
          format: date-time
          nullable: true
    PopularHash:
      type: object
      required: [hash, canonical_name, size, source_count]
      properties:
        hash:
          $ref: '#/components/schemas/HashType'
        canonical_name:
          type: string
        size:
          type: integer
          format: int64
        source_count:
          type: integer
    RegisterRequest:
      type: object
      required: [indexer_id, protocol, url, hostname, version]
      properties:
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        url:
          type: string
        hostname:
          type: string
        version:
          type: string
    IndexerRegistration:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
          required: [registered_at]
          properties:
            registered_at:
              type: string
              format: date-time
